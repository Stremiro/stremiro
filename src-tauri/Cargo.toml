[package]
name = "stremiro"
version = "0.5.0-alpha"
description = "Lightweight Stremio-compatible desktop client"
authors = ["Stremiro contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stremiro_lib"
# Desktop-only app: rlib alone — staticlib/cdylib exist only for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["rustls-no-provider", "stream", "gzip", "deflate", "brotli"], default-features = false }
rustls = { version = "0.23", features = ["ring"], default-features = false }
tauri-plugin-libmpv = "0.3.2"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["time", "rt", "fs", "macros", "sync"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
futures-util = "0.3.34"
tauri-plugin-dialog = "2.7.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"

[profile.dev]
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Fat LTO + single codegen unit: smaller and faster shipped binary at the
# cost of release-build time (dev profile is unaffected). `opt-level` stays
# at the default 3 — "z" would trade stream-matching CPU for a negligible
# slice of a bundle already dominated by libmpv.
lto = true
codegen-units = 1
panic = "abort"
strip = true
