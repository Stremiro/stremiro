[package]
name = "stremiro"
version = "0.8.5-alpha"
description = "Lightweight Stremio-compatible desktop client"
authors = ["Stremiro contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stremiro_lib"
# Desktop-only app: rlib alone — staticlib/cdylib exist only for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-updater = "2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# `system-proxy` honors Windows/macOS proxy settings; declared here so it
# does not depend on another crate enabling it through feature unification.
reqwest = { version = "0.13", features = ["rustls-no-provider", "stream", "gzip", "deflate", "brotli", "system-proxy"], default-features = false }
rustls = { version = "0.23", features = ["ring"], default-features = false }
tauri-plugin-libmpv = "0.3.2"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["time", "rt", "macros", "sync"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
futures-util = "0.3.34"
tauri-plugin-dialog = "2.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25.4", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
tauri-plugin-single-instance = "2.5.1"
tauri-plugin-autostart = "2.7.0"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[patch.crates-io]
tauri-plugin-libmpv = { path = "vendor/tauri-plugin-libmpv" }

[profile.dev]
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Fat LTO + single codegen unit: smaller and faster shipped binary at the
# cost of release-build time (dev profile is unaffected). `opt-level` stays
# at the default 3 — "z" would trade stream-matching CPU for a negligible
# slice of a bundle already dominated by libmpv.
lto = true
codegen-units = 1
strip = true
